<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão Interativo - Design Premium</title>
    <!-- Importando fonte arredondada moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #00b14f; /* Verde original */
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            display: flex;
            color: white;
        }

        /* ----- LADO ESQUERDO (Fixo) ----- */
        #lado-esquerdo {
            width: 35%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }
        
        /* Animação de piscar suave */
        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .titulo-animado {
            font-size: 65px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 40px;
            animation: piscar 2s infinite ease-in-out;
            color: #d1ffd4; /* Verde bem clarinho */
        }

        .qr-code-caixa {
            background: white;
            padding: 20px;
            border-radius: 30px; /* Cantos bem arredondados */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .qr-code-caixa img {
            width: 280px;
            height: 280px;
            display: block;
        }

        .instrucoes {
            font-size: 26px;
            font-weight: 700;
            color: #d1ffd4;
        }

        /* ----- LADO DIREITO (Dinâmico) ----- */
        #lado-direito {
            width: 65%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* Estado Vazio (Nenhum recado) */
        #estado-vazio {
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s;
        }
        #estado-vazio h2 {
            font-size: 50px;
            margin: 20px 0 10px 0;
        }
        #estado-vazio p {
            font-size: 24px;
            color: #d1ffd4;
            margin: 0;
        }

        /* Estado com Mensagem e Foto */
        #estado-mensagem {
            display: none; /* Escondido no início */
            opacity: 0;
            transition: opacity 1s ease-in-out;
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .foto-container {
            width: 100%;
            height: 500px; /* Altura fixa para manter o padrão */
            border-radius: 40px; /* Borda bem redonda */
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            background: #000;
            position: relative;
            z-index: 1;
        }
        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que a foto preencha sem distorcer */
        }

        /* A Bolha Roxa sobreposta */
        .bolha-roxa {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            width: 90%;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            margin-top: -60px; /* Puxa a bolha para cima da foto */
            position: relative;
            z-index: 2; /* Fica na frente da foto */
            text-align: center;
        }

        .etiqueta-nome {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
        }
        .etiqueta-valor {
            margin-left: 10px;
            opacity: 0.9;
        }

        .texto-recado {
            font-size: 55px;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <!-- Lado Esquerdo -->
    <div id="lado-esquerdo">
        <div class="titulo-animado">mande seu<br>alô!</div>
        <div class="qr-code-caixa">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://saddlebrown-falcon-486392.hostingersite.com" alt="QR Code">
        </div>
        <div class="instrucoes">
            Aponte a câmera do celular<br>e veja seu recado brilhar no telão!
        </div>
    </div>

    <!-- Lado Direito -->
    <div id="lado-direito">
        
        <!-- Tela de Espera -->
        <div id="estado-vazio">
            <!-- Ícone simulado -->
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <h2>Nenhum recado ainda</h2>
            <p>Seja o primeiro a mandar o seu!</p>
        </div>

        <!-- Tela de Mensagem Ativa -->
        <div id="estado-mensagem">
            <div class="foto-container" id="caixa-foto">
                <img id="foto" src="" alt="Foto Cliente">
            </div>
            
            <div class="bolha-roxa">
                <div class="etiqueta-nome">
                    <span id="nome">Carregando...</span> 
                    <span class="etiqueta-valor" id="valor"></span>
                </div>
                <p class="texto-recado" id="mensagem"></p>
            </div>
        </div>

    </div>

    <script>
        // Simulador de recados
        const recados = [
            { nome: "Vanessa", valor: "R$ 5.00", texto: "Oi tô amando o show", foto: "https://images.unsplash.com/photo-1540039155732-d68a52bc371c?q=80&w=1000&auto=format&fit=crop" },
            { nome: "João Silva", valor: "R$ 10.00", texto: "Manda um abraço pra mesa 4!", foto: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1000&auto=format&fit=crop" },
            { nome: "Sem Foto", valor: "R$ 2.00", texto: "Apenas texto de teste!", foto: "" } // Simulando envio sem foto
        ];

        let contador = 0;
        const estadoVazio = document.getElementById('estado-vazio');
        const estadoMensagem = document.getElementById('estado-mensagem');
        
        const campoNome = document.getElementById('nome');
        const campoValor = document.getElementById('valor');
        const campoMensagem = document.getElementById('mensagem');
        const campoFoto = document.getElementById('foto');
        const caixaFoto = document.getElementById('caixa-foto');

        function girarTelao() {
            // Apaga suavemente
            estadoMensagem.style.opacity = 0;

            setTimeout(() => {
                if(contador >= recados.length) contador = 0; // Recomeça
                
                const recadoAtual = recados[contador];
                
                // Preenche os dados
                campoNome.innerText = recadoAtual.nome;
                campoValor.innerText = recadoAtual.valor ? recadoAtual.valor : "";
                campoMensagem.innerText = '"' + recadoAtual.texto + '"';
                
                // Lógica da Foto
                if(recadoAtual.foto !== "") {
                    campoFoto.src = recadoAtual.foto;
                    caixaFoto.style.display = "block"; 
                } else {
                    // Se não tiver foto, esconde a caixa preta de imagem
                    caixaFoto.style.display = "none"; 
                }
                
                // Esconde o vazio e mostra a mensagem
                estadoVazio.style.display = "none";
                estadoMensagem.style.display = "flex";
                
                // Acende a tela novamente
                setTimeout(() => {
                    estadoMensagem.style.opacity = 1;
                }, 50);

                contador++;
            }, 1000); 
        }

        // Simula uma espera de 4 segundos na tela "Nenhum recado ainda" antes de começar
        setTimeout(() => {
            setInterval(girarTelao, 8000); // Troca a cada 8s
            girarTelao(); // Inicia o primeiro
        }, 4000);
    </script>

</body>
</html>
