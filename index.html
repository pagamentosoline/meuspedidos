<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão Interativo - Max e Uniforme</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #00c652; /* Fundo base verde vibrante */
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            display: flex;
            color: white;
        }

        /* ----- LADO ESQUERDO (Com Degradê e Sombra divisória) ----- */
        #lado-esquerdo {
            width: 35%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            /* O Degradê e a Sombra que dividem a tela */
            background: linear-gradient(145deg, #009940 0%, #00b14f 100%);
            box-shadow: 20px 0 50px rgba(0,0,0,0.4);
            z-index: 10;
        }
        
        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .titulo-animado {
            font-size: 75px; /* Ainda maior */
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 40px;
            animation: piscar 2s infinite ease-in-out;
            color: #d1ffd4;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .qr-code-caixa {
            background: white;
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .qr-code-caixa img {
            width: 280px;
            height: 280px;
            display: block;
        }

        .instrucoes {
            font-size: 28px;
            font-weight: 700;
            color: #d1ffd4;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
        }

        /* ----- LADO DIREITO (Aproveitamento Máximo) ----- */
        #lado-direito {
            width: 65%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        #estado-vazio {
            text-align: center;
            opacity: 1;
        }
        #estado-vazio h2 { font-size: 55px; margin-bottom: 10px; }
        #estado-vazio p { font-size: 28px; color: #e6ffe6; }

        /* Container Travado para não pular */
        .widget-central {
            width: 92%; /* Ocupa quase todo o espaço disponível */
            height: 85vh; /* Altura travada! */
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* Área da foto com altura fixa */
        .foto-container {
            width: 100%;
            height: 55vh; /* Trava o tamanho da foto */
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            background: #000;
        }
        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* A foto preenche o bloco sem amassar */
        }

        /* Bolha roxa gigante e padronizada */
        .bolha-roxa {
            background: #9333ea;
            width: 100%;
            min-height: 25vh; /* Altura mínima garantida para o texto */
            border-radius: 30px;
            padding: 50px 40px 40px 40px;
            box-sizing: border-box;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            margin-top: -30px; /* Encaixe perfeito em cima da foto */
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Etiqueta idêntica à da sua foto (fundo lilás claro) */
        .etiqueta-topo {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: #b678f2; /* Roxo claro */
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 26px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .etiqueta-valor {
            background: rgba(0,0,0,0.15); /* Fundo sutil para o preço */
            padding: 3px 15px;
            border-radius: 20px;
            font-size: 24px;
        }

        .texto-recado {
            font-size: 55px; /* Texto bem maior */
            font-weight: 900;
            margin: 0;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="lado-esquerdo">
        <div class="titulo-animado">🎵 mande seu<br>alô!</div>
        <div class="qr-code-caixa">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://saddlebrown-falcon-486392.hostingersite.com" alt="QR Code">
        </div>
        <div class="instrucoes">Aponte a câmera do celular<br>e veja seu recado brilhar no telão!</div>
    </div>

    <div id="lado-direito">
        
        <div id="estado-vazio">
            <h2>Nenhum recado ainda</h2>
            <p>Seja o primeiro a mandar o seu!</p>
        </div>

        <div class="widget-central" id="estado-mensagem">
            <div class="foto-container" id="caixa-foto">
                <img id="foto" src="" alt="Foto Cliente">
            </div>
            
            <div class="bolha-roxa">
                <div class="etiqueta-topo">
                    <span id="nome">Carregando...</span> 
                    <span id="container-valor"><span class="etiqueta-valor" id="valor"></span></span>
                </div>
                <p class="texto-recado" id="mensagem"></p>
            </div>
        </div>

    </div>

    <script>
        const recados = [
            { nome: "Vanessa", valor: "R$ 5.00", texto: "Oi tô amando o show", foto: "https://images.unsplash.com/photo-1540039155732-d68a52bc371c?q=80&w=1000&auto=format&fit=crop" },
            { nome: "João Silva", valor: "R$ 10.00", texto: "Manda um abraço pra mesa 4!", foto: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1000&auto=format&fit=crop" },
            { nome: "Equipe", valor: "", texto: "Mensagem gigante ocupando o espaço sem a foto, alinhada e perfeitamente no centro!", foto: "" } 
        ];

        let contador = 0;
        const estadoVazio = document.getElementById('estado-vazio');
        const estadoMensagem = document.getElementById('estado-mensagem');
        
        const campoNome = document.getElementById('nome');
        const campoValor = document.getElementById('valor');
        const containerValor = document.getElementById('container-valor');
        const campoMensagem = document.getElementById('mensagem');
        const campoFoto = document.getElementById('foto');
        const caixaFoto = document.getElementById('caixa-foto');

        function girarTelao() {
            estadoMensagem.style.opacity = 0;

            setTimeout(() => {
                if(contador >= recados.length) contador = 0;
                
                const recadoAtual = recados[contador];
                
                campoNome.innerText = recadoAtual.nome;
                
                // Lógica para esconder o valor se não tiver
                if(recadoAtual.valor) {
                    campoValor.innerText = recadoAtual.valor;
                    containerValor.style.display = "inline";
                } else {
                    containerValor.style.display = "none";
                }
                
                campoMensagem.innerText = '"' + recadoAtual.texto + '"';
                
                // Exibe ou esconde a caixa da foto sem desmontar a tela
                if(recadoAtual.foto !== "") {
                    campoFoto.src = recadoAtual.foto;
                    caixaFoto.style.display = "block"; 
                } else {
                    caixaFoto.style.display = "none"; 
                }
                
                estadoVazio.style.display = "none";
                estadoMensagem.style.display = "flex";
                
                setTimeout(() => {
                    estadoMensagem.style.opacity = 1;
                }, 50);

                contador++;
            }, 800); 
        }

        setTimeout(() => {
            setInterval(girarTelao, 8000); 
            girarTelao(); 
        }, 3000);
    </script>

</body>
</html>
