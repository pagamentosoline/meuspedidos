<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão Interativo - Design Original</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #00c652; /* Fundo verde contínuo */
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            display: flex;
            color: white;
        }

        /* ----- LADO ESQUERDO ----- */
        #lado-esquerdo {
            width: 35%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }
        
        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .titulo-animado {
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 30px;
            animation: piscar 2.5s infinite ease-in-out;
            color: #e6ffe6;
        }

        .qr-code-caixa {
            background: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .qr-code-caixa img {
            width: 250px;
            height: 250px;
            display: block;
        }

        .instrucoes {
            font-size: 24px;
            font-weight: 700;
            color: #e6ffe6;
        }

        /* ----- LADO DIREITO (Widget Flutuante) ----- */
        #lado-direito {
            width: 65%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #estado-vazio {
            text-align: center;
            opacity: 1;
        }
        #estado-vazio h2 { font-size: 45px; margin-bottom: 5px; }
        #estado-vazio p { font-size: 22px; color: #e6ffe6; }

        /* Container que segura a foto e a mensagem juntos no meio da tela */
        .widget-central {
            width: 80%;
            max-width: 650px;
            display: none; /* Escondido até carregar o recado */
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .foto-container {
            width: 100%;
            height: 350px; 
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
            background: #111;
        }
        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bolha roxa do mesmo tamanho da foto, flutuando embaixo */
        .bolha-roxa {
            background: #9333ea; /* Roxo original */
            width: 100%;
            border-radius: 25px;
            padding: 40px 30px 30px 30px;
            box-sizing: border-box;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            margin-top: -15px; /* Sobrepõe levemente a foto */
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* A etiqueta que fica no meio termo entre a foto e o roxo */
        .etiqueta-topo {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.25);
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        .etiqueta-valor {
            margin-left: 10px;
            opacity: 0.9;
        }

        .texto-recado {
            font-size: 45px;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div id="lado-esquerdo">
        <div class="titulo-animado">mande seu<br>alô!</div>
        <div class="qr-code-caixa">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://saddlebrown-falcon-486392.hostingersite.com" alt="QR Code">
        </div>
        <div class="instrucoes">Aponte a câmera do celular<br>e veja seu recado brilhar no telão!</div>
    </div>

    <div id="lado-direito">
        
        <div id="estado-vazio">
            <h2>Nenhum recado ainda</h2>
            <p>Seja o primeiro a mandar o seu!</p>
        </div>

        <div class="widget-central" id="estado-mensagem">
            <div class="foto-container" id="caixa-foto">
                <img id="foto" src="" alt="">
            </div>
            
            <div class="bolha-roxa">
                <div class="etiqueta-topo">
                    <span id="nome">Carregando...</span> 
                    <span class="etiqueta-valor" id="valor"></span>
                </div>
                <p class="texto-recado" id="mensagem"></p>
            </div>
        </div>

    </div>

    <script>
        // Simulador de recados exatamente como nos seus testes
        const recados = [
            { nome: "Vanessa", valor: "R$ 5.00", texto: "Oi tô amando o show", foto: "https://images.unsplash.com/photo-1540039155732-d68a52bc371c?q=80&w=1000&auto=format&fit=crop" },
            { nome: "João Silva", valor: "R$ 10.00", texto: "Manda um abraço pra mesa 4!", foto: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1000&auto=format&fit=crop" },
            { nome: "Equipe", valor: "", texto: "Mensagem sem foto para testar o layout!", foto: "" } 
        ];

        let contador = 0;
        const estadoVazio = document.getElementById('estado-vazio');
        const estadoMensagem = document.getElementById('estado-mensagem');
        
        const campoNome = document.getElementById('nome');
        const campoValor = document.getElementById('valor');
        const campoMensagem = document.getElementById('mensagem');
        const campoFoto = document.getElementById('foto');
        const caixaFoto = document.getElementById('caixa-foto');

        function girarTelao() {
            estadoMensagem.style.opacity = 0;

            setTimeout(() => {
                if(contador >= recados.length) contador = 0;
                
                const recadoAtual = recados[contador];
                
                campoNome.innerText = recadoAtual.nome;
                campoValor.innerText = recadoAtual.valor ? recadoAtual.valor : "";
                campoMensagem.innerText = '"' + recadoAtual.texto + '"';
                
                if(recadoAtual.foto !== "") {
                    campoFoto.src = recadoAtual.foto;
                    caixaFoto.style.display = "block"; 
                } else {
                    caixaFoto.style.display = "none"; 
                }
                
                estadoVazio.style.display = "none";
                estadoMensagem.style.display = "flex";
                
                setTimeout(() => {
                    estadoMensagem.style.opacity = 1;
                }, 50);

                contador++;
            }, 1000); 
        }

        setTimeout(() => {
            setInterval(girarTelao, 8000); 
            girarTelao(); 
        }, 3000);
    </script>

</body>
</html>
