<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão de Recados - Peso Pena</title>
    <style>
        /* Tudo aqui é otimizado para não pesar a memória da TV */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Arial Black', sans-serif;
            overflow: hidden; /* Trava a rolagem da tela */
            display: flex; justify-content: center; align-items: center;
        }
        #caixa-recado {
            text-align: center;
            opacity: 0; /* Começa invisível para o efeito de piscar */
            transition: opacity 1.5s ease-in-out;
            max-width: 90%;
        }
        .nome-cliente {
            font-size: 55px;
            color: #00ffcc; /* Verde neon */
            text-shadow: 0 0 15px #00ffcc;
            margin-bottom: 20px;
        }
        .texto-recado {
            font-size: 90px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f; /* Rosa neon */
        }
        /* Efeito de coração batendo para dar vida à tela */
        @keyframes pulso {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .animacao-pulso {
            animation: pulso 3s infinite;
        }
    </style>
</head>
<body>

    <!-- Esta é a área onde a mensagem aparece na tela -->
    <div id="caixa-recado" class="animacao-pulso">
        <div class="nome-cliente" id="nome">Carregando...</div>
        <div class="texto-recado" id="mensagem">Preparando o telão!</div>
    </div>

    <script>
        // Simulador de recados (Aqui é onde depois conectaremos o seu Banco de Dados)
        const recados = [
            { nome: "João Silva", texto: "Manda um abraço pra mesa 4!" },
            { nome: "Maria", texto: "O show tá bom demais!" },
            { nome: "Galera do Fundão", texto: "Toca aquela moda antiga!" },
            { nome: "Marcos", texto: "Aniversário da Ana hoje, manda parabéns!" }
        ];

        let contador = 0;
        const caixa = document.getElementById('caixa-recado');
        const campoNome = document.getElementById('nome');
        const campoMensagem = document.getElementById('mensagem');

        function girarTelao() {
            // Apaga a mensagem atual lentamente
            caixa.style.opacity = 0;

            setTimeout(() => {
                // Prepara a próxima mensagem no escuro
                if(contador >= recados.length) contador = 0; // Se acabar, recomeça
                
                campoNome.innerText = recados[contador].nome + " mandou:";
                campoMensagem.innerText = '"' + recados[contador].texto + '"';
                
                // Acende a nova mensagem na tela
                caixa.style.opacity = 1;
                contador++;
            }, 1500); // Tempo que a tela fica apagada entre um recado e outro
        }

        // Troca de recado automaticamente a cada 8 segundos
        setInterval(girarTelao, 8000);
        
        // Puxa a primeira mensagem logo que a TV liga
        setTimeout(girarTelao, 1000);
    </script>

</body>
</html>
